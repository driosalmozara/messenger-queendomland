<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Messenger Queendomland</title>
<link rel="manifest" href="./manifest.json"/><meta name="theme-color" content="#0d0c0a"/>
<link rel="apple-touch-icon" href="corona.png"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="trono-de-oro.css">
<script src="toasts.js" defer></script>
<style>
html,body{height:100%}
body{margin:0;overflow:hidden;display:flex;flex-direction:column;height:100vh;height:100dvh;
  background:#0d0c0a;color:#f7f2ea;font-family:Jost,"Segoe UI",sans-serif}
#topbar{flex:none;display:flex;align-items:center;gap:10px;z-index:60;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:rgba(13,12,10,.97);border-bottom:1px solid rgba(201,162,75,.25)}
#topbar h1{font-size:18px;margin:0;flex:1;color:#e7cf9a;font-family:"Cormorant Garamond",serif}
#topbar .tbtn,.ibtn{background:transparent;border:1px solid rgba(201,162,75,.4);
  color:#e7cf9a;border-radius:999px;padding:5px 10px;font-size:12px;min-height:0;cursor:pointer}
#mirror-dot{width:9px;height:9px;border-radius:50%;background:#7c3aed;box-shadow:0 0 8px #7c3aed;display:none}
#errbar{flex:none;display:none;background:#7f1d1d;color:#fff;font-size:12px;padding:6px 14px;word-break:break-word}
main{flex:1;min-height:0;overflow-y:auto;padding:12px;width:100%;max-width:760px;margin:0 auto;
  -webkit-overflow-scrolling:touch}
#tabbar{flex:none;display:flex;gap:6px;z-index:60;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  background:rgba(13,12,10,.97);border-top:1px solid rgba(201,162,75,.25)}
#tabbar button{flex:1;background:transparent;border:1px solid transparent;color:#a1a1aa;
  border-radius:12px;padding:8px 4px;font-size:11px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;min-height:0}
#tabbar button .ico{font-size:19px}
#tabbar button.on{color:#e7cf9a;border-color:rgba(201,162,75,.4);background:rgba(201,162,75,.08)}
#tabbar .bdg{position:relative;top:-2px;right:-6px;background:#6e1f2a;color:#fff;border-radius:999px;
  font-size:9px;padding:1px 5px;display:none}
.rowitem{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid rgba(201,162,75,.18);
  border-radius:12px;margin:8px 0;background:rgba(255,255,255,.02);cursor:pointer}
.rowitem .ava{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid #c9a24b;
  background:#161625;flex:none;display:flex;align-items:center;justify-content:center;color:#c9a24b}
.rowitem .meta{flex:1;min-width:0}
.rowitem .meta b{display:block;color:#f7f2ea;font-size:14px}
.rowitem .meta span{display:block;color:#a1a1aa;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowitem .dotnew{width:10px;height:10px;border-radius:50%;background:#c9a24b;box-shadow:0 0 8px rgba(201,162,75,.8);flex:none}
#conv{display:flex;flex-direction:column;height:100%}
#conv-head{display:flex;gap:8px;align-items:center;padding:6px 4px 10px;border-bottom:1px solid rgba(201,162,75,.2)}
#conv-head b{flex:1;color:#e7cf9a;font-size:15px}
#conv-msgs{flex:1;min-height:0;overflow-y:auto;padding:10px 2px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:82%;padding:8px 12px;border-radius:14px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.bub.mine{align-self:flex-end;background:rgba(201,162,75,.16);border:1px solid rgba(201,162,75,.4);color:#f7f2ea}
.bub.theirs{align-self:flex-start;background:rgba(255,255,255,.05);border:1px solid rgba(201,162,75,.15);color:rgba(247,242,234,.78)}
.bub .who{display:block;font-size:11px;color:#c9a24b;margin-bottom:2px}
.bub .tm{display:block;font-size:10px;color:#71717a;margin-top:4px;text-align:right}
.bub img,.bub video{max-width:100%;border-radius:10px;margin-top:4px;display:block}
#conv-input{display:flex;gap:6px;padding:10px 2px 4px;border-top:1px solid rgba(201,162,75,.2);align-items:center}
#conv-input input#msg-in{flex:1;min-width:0;margin:0;background:#1d1712;color:#f7f2ea;
  border:1px solid rgba(201,162,75,.3);border-radius:10px;padding:10px 12px}
#conv-input button{min-height:0;padding:10px 14px}
.sup-banner{background:rgba(124,58,237,.12);border:1px solid rgba(124,58,237,.5);color:#c4b5fd;
  border-radius:10px;padding:8px 12px;font-size:12px;margin:0 0 8px}
#gate{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;
  background:rgba(8,5,9,.96);padding:20px}
#gate .gcard{max-width:420px;width:100%;background:rgba(13,10,14,.97);border:1px solid rgba(201,162,75,.5);
  border-radius:18px;padding:26px 22px;text-align:center}
#gate input{background:#1d1712;color:#f7f2ea;border:1px solid rgba(201,162,75,.3);border-radius:10px;
  padding:10px 12px;margin:6px 0;width:100%}
#gate button{background:#c9a24b;color:#0d0c0a;font-weight:700;border:none;border-radius:10px;
  padding:10px 14px;cursor:pointer;margin:4px 2px}
#gate button.secondary{background:transparent;color:#e7cf9a;border:1px solid #c9a24b}
.hidden{display:none!important}
.empty{color:#a1a1aa;text-align:center;padding:30px 10px;font-size:13px}
.small{color:#a1a1aa;font-size:12px}
</style>
</head>
<body>
<div id="topbar">
  <button class="tbtn hidden" id="back-btn" onclick="closeConv()">←</button>
  <h1>💬 Messenger <span style="color:#c9a24b">Queendomland</span></h1>
  <span id="mirror-dot" title=""></span>
  <button class="tbtn" id="bell-btn" onclick="askNotif()">🔕</button>
</div>
<div id="errbar"></div>
<main id="screen"></main>
<nav id="tabbar">
  <button id="tab-rooms" class="on" onclick="goView('rooms')"><span class="ico">#</span>Chats<span class="bdg" id="bdg-rooms"></span></button>
  <button id="tab-dms" onclick="goView('dms')"><span class="ico">💬</span>Mensajes<span class="bdg" id="bdg-dms"></span></button>
  <button id="tab-set" onclick="goView('set')"><span class="ico">⚙️</span>Ajustes</button>
</nav>
<div id="gate" class="hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ofyedqoipexpsvjsipze.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_X4SJUT7cnbFuv7l_1Y3OjQ__poTLx0b';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const BIO_CRED_KEY = 'flr_bio_cred';

let me = null, profile = null;
let view = 'rooms', rooms = [], roomById = {};
let convMode = null;   // {type:'room',id} | {type:'dm',convId,uid} | {type:'sup',uid}
let liveChannel = null;
let isSuperAd = false, isMod = false, isChatMod = false;
let people = [], ownedSet = new Set();

/* Errores visibles: nunca más fallos silenciosos */
window.addEventListener('error', function(e){
  const b = document.getElementById('errbar');
  if (b) { b.style.display='block'; b.textContent = '⚠ Error: ' + (e.message || 'desconocido'); }
});
  window.addEventListener('unhandledrejection', function(e){
  const b = document.getElementById('errbar');
  if (b) { b.style.display='block'; b.innerHTML = '⚠ ' + ((e.reason && e.reason.message) || e.reason || 'Error inesperado') + ' <button class="ibtn" onclick="location.reload()">Reintentar</button>'; }
});
if ('caches' in window) {
  caches.keys().then(function(ks){ ks.forEach(function(k){ if (k !== 'ql-messenger-v2') caches.delete(k); }); });
}
function fatal(msg){
  const b = document.getElementById('errbar');
  if (b) { b.style.display='block'; b.innerHTML = '⚠ ' + msg + ' <button class="ibtn" onclick="location.reload()">Reintentar</button>'; }
}
function resync(){
  if (document.hidden) return;
  try {
    subscribeLive();
    updateBadges();
    if (convMode && convMode.type === 'room') loadRoomMsgs(convMode.id);
    if (convMode && convMode.type === 'dm') loadThreadMsgs(convMode.convId);
  } catch(e){}
}

function esc(v){ return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function hh(t){ const d=new Date(t); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function bufToB64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64ToBuf(b64){ const s=atob(b64.replace(/-/g,'+').replace(/_/g,'/')); const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i); return u.buffer; }
function challenge(){ const a=new Uint8Array(32); crypto.getRandomValues(a); return a.buffer; }

/* ─────────── PUERTA DE ENTRADA ─────────── */
async function verifyBiometric(){
  const idB64 = localStorage.getItem(BIO_CRED_KEY); if(!idB64) return false;
  const cred = await navigator.credentials.get({ publicKey:{
    challenge: challenge(),
    allowCredentials:[{ id: b64ToBuf(idB64), type:'public-key', transports:['internal'] }],
    userVerification:'required', timeout:60000 }});
  return !!cred;
}
function showBioGate(){
  const g=document.getElementById('gate'); g.classList.remove('hidden');
  g.innerHTML = `<div class="gcard"><div style="font-size:44px">🔐</div>
    <h2 style="margin:8px 0 4px;color:#e7cf9a;">Messenger Queendomland</h2>
    <p class="small">Desbloquea con tu huella o rostro.</p>
    <button onclick="bioUnlock()">🔓 Desbloquear</button>
    <button class="secondary" onclick="showLoginGate()">Usar contraseña</button></div>`;
}
async function bioUnlock(){
  try{
    if(!(await verifyBiometric())) return;
    const saved=JSON.parse(decodeURIComponent(escape(atob(localStorage.getItem('flr_cred')||''))));
    const { error } = await db.auth.signInWithPassword({ email:saved.email, password:saved.password });
    if(error){ alert('Sesión no disponible: '+error.message); showLoginGate(); return; }
    const { data:{ session } } = await db.auth.getSession();
    document.getElementById('gate').classList.add('hidden');
    start(session.user);
  }catch(e){ showLoginGate(); }
}
function showLoginGate(){
  const g=document.getElementById('gate'); g.classList.remove('hidden');
  g.innerHTML = `<div class="gcard"><div style="font-size:44px">💬</div>
    <h2 style="margin:8px 0 4px;color:#e7cf9a;">Messenger Queendomland</h2>
    <p class="small">Entra con tu cuenta de la casa.</p>
    <input id="g-email" type="email" placeholder="Correo"/>
    <input id="g-pass" type="password" placeholder="Contraseña"/>
    <button onclick="gateLogin()">Entrar</button>
    <p class="small" style="margin-top:10px;"><a href="https://queendomland.com/index.html" style="color:#e7cf9a;">← Volver a la casa</a></p></div>`;
}
async function gateLogin(){
  const email=document.getElementById('g-email').value.trim();
  const pass=document.getElementById('g-pass').value;
  const { data, error } = await db.auth.signInWithPassword({ email, password: pass });
  if(error) return alert(error.message);
  localStorage.setItem('flr_cred', btoa(unescape(encodeURIComponent(JSON.stringify({ email, password: pass })))));
  document.getElementById('gate').classList.add('hidden');
  start(data.user);
}

/* ─────────── SESIÓN, ROLES Y VISTAS ─────────── */
async function start(user){
  me = user;
  try {
    const { data: p } = await db.from('profiles').select('*').eq('id', me.id).maybeSingle();
    profile = p;
    if(!profile){ alert('Completa tu perfil en la casa primero.'); location.href='https://queendomland.com/index.html'; return; }
    if (localStorage.getItem('flr_impersonating')==='1'){
      const d=document.getElementById('mirror-dot'); d.style.display='inline-block'; d.title='Modo espejo activo';
    }
    await loadStaffFlags();
    await loadRooms();
    goView('rooms');
    subscribeLive();
    updateBadges();
    setInterval(updateBadges, 30000);
    document.addEventListener('click', function once(){ askNotif(); document.removeEventListener('click', once); });
    document.addEventListener('visibilitychange', resync);
    window.addEventListener('online', resync);
  } catch(e){
    fatal('No se pudo cargar tu sesión: ' + (e.message || e));
  }
}
async function loadStaffFlags(){
  const [s, m, c, own, ppl] = await Promise.all([
    db.rpc('is_superadmin'),
    db.rpc('am_i_moderator'),
    db.rpc('am_i_chatmod'),
    db.from('relationships').select('submissive_id').eq('dominant_id', me.id).eq('status','confirmed'),
    db.from('profiles').select('id, display_name, role, chat_muted').order('display_name').limit(400)
  ]);
  isSuperAd = !!s.data; isMod = !!m.data; isChatMod = !!c.data;
  ownedSet = new Set((own.data||[]).map(r=>r.submissive_id));
  people = ppl.data || [];
}
function goView(v){
  view=v; convMode=null;
  if(window.__typeCh){ db.removeChannel(window.__typeCh); window.__typeCh=null; }
  document.getElementById('back-btn').classList.add('hidden');
  document.querySelectorAll('#tabbar button').forEach(b=>b.classList.remove('on'));
  document.getElementById('tab-'+v).classList.add('on');
  if(v==='rooms') renderRooms();
  if(v==='dms') renderDMs();
  if(v==='set') renderSettings();
}
function closeConv(){
  if(window.__typeCh){ db.removeChannel(window.__typeCh); window.__typeCh=null; }
  if(view==='rooms') renderRooms(); else if(view==='dms') renderDMs(); else renderSettings();
  document.getElementById('back-btn').classList.add('hidden');
  document.querySelectorAll('#tabbar button').forEach(b=>b.classList.remove('on'));
  document.getElementById('tab-'+view).classList.add('on');
  convMode=null;
}
function askNotif(){
  if(!('Notification' in window)) return;
  if(Notification.permission==='default') Notification.requestPermission().then(setBell);
  else setBell();
}
function setBell(){
  const b=document.getElementById('bell-btn');
  b.textContent = ('Notification' in window && Notification.permission==='granted') ? '🔔' : '🔕';
}

/* ─────────── CHAT: SALAS ─────────── */
async function isSuper(){ const { data } = await db.rpc('is_superadmin'); return !!data; }
async function loadRooms(){
  const { data } = await db.from('chat_rooms').select('*').order('is_default',{ascending:false}).order('created_at');
  rooms = data || []; roomById={};
  rooms.forEach(r=>roomById[r.id]=r);
  if(!await isSuper()){
    const priv = rooms.filter(r=>r.is_private);
    if(priv.length){
      const ids = priv.map(r=>r.id);
      const { data: mem } = await db.from('chat_room_members').select('room_id').eq('user_id', me.id).in('room_id', ids);
      const ok = new Set((mem||[]).map(m=>m.room_id));
      rooms = rooms.filter(r=>!r.is_private || ok.has(r.id));
    }
  }
}
function renderRooms(){
  const s=document.getElementById('screen');
  s.innerHTML = `<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
      <b style="color:#e7cf9a;font-size:16px;"># Salas de la casa</b>
      <span class="small" style="margin-left:auto;">${rooms.length}</span></div>` +
    (rooms.map(r=>{
      const newMark = (Number(sessionStorage.getItem('msgr_new_'+r.id)||0) > 0);
      return `<div class="rowitem" onclick="openRoom('${r.id}')">
        <div class="ava">${r.is_private?'🔒':'#'}</div>
        <div class="meta"><b>${esc(r.name)}</b><span>${esc(r.description||'Sala de la casa')}</span></div>
        ${newMark?'<span class="dotnew"></span>':''}</div>`;
    }).join('') || '<p class="empty">No hay salas disponibles para ti.</p>');
}
async function openRoom(id){
  const room = roomById[id]; if(!room) return;
  const { data: ban } = await db.from('chat_room_bans').select('*').eq('room_id',id).eq('user_id',me.id).maybeSingle();
  const { data: mute } = await db.from('chat_room_mutes').select('user_id').eq('room_id',id).eq('user_id',me.id).maybeSingle();
  convMode={type:'room', id, ban:!!ban, mute:!!mute};
  sessionStorage.removeItem('msgr_new_'+id);
  document.getElementById('back-btn').classList.remove('hidden');
  document.querySelectorAll('#tabbar button').forEach(b=>b.classList.remove('on'));
  const s=document.getElementById('screen');
  s.innerHTML = `<div id="conv">
    <div id="conv-head"><b>${room.is_private?'🔒':'#'} ${esc(room.name)}</b>
      <span id="typing-lbl" class="small" style="color:#4ade80;flex:none;"></span>
      <button class="ibtn" onclick="openMembersModal()">👥</button></div>
    <div id="conv-msgs"><p class="empty">Cargando…</p></div>
    <div id="conv-input">
      <button class="ibtn" onclick="openEmojiPicker('msg-in')">😀</button>
      <input type="file" id="room-file" style="display:none" accept="image/*,video/*" onchange="pickRoomFile(this)"/>
      <button class="ibtn" onclick="document.getElementById('room-file').click()">📎</button>
      <input id="msg-in" placeholder="${ban?'🚫 Expulsado de esta sala':mute?'🔇 Silenciado en esta sala':'Escribe y pulsa Enviar…'}" ${(ban||mute)?'disabled':''}/>
      <button onclick="sendRoomMsg()" ${(ban||mute)?'disabled':''}>➤</button>
    </div>
    <div id="room-file-chip" class="small" style="padding:0 4px 6px;"></div></div>`;
  const inp=document.getElementById('msg-in');
  if(inp){
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') sendRoomMsg(); });
    inp.addEventListener('input', sendTyping);
  }
  if(window.__typeCh) db.removeChannel(window.__typeCh);
  window.__typeCh = db.channel('msgr-typing-'+id);
  window.__typeCh.on('broadcast', { event:'typing' }, p => showTyping(p.payload?.name||'')).subscribe();
  loadRoomMsgs(id);
}
async function loadRoomMsgs(id){
  const { data } = await db.from('chat_messages_public').select('*').eq('room_id',id)
    .order('created_at',{ascending:false}).limit(120);
  const list=(data||[]).reverse();
  const box=document.getElementById('conv-msgs'); if(!box) return;
  box.innerHTML = list.map(m=>bubble(m, m.user_id===me.id, m.display_name)).join('') || '<p class="empty">Sé la primera voz de esta sala.</p>';
  box.scrollTop=box.scrollHeight;
}
async function sendRoomMsg(){
  const inp=document.getElementById('msg-in'); const body=inp.value.trim();
  if(!body || !convMode || convMode.type!=='room') return;
  if(convMode.ban) return alert('🚫 Tu acceso a esta sala está prohibido.');
  if(convMode.mute) return alert('🔇 Estás silenciado en esta sala.');
  const pm = people.find(x=>x.id===me.id);
  if(pm && pm.chat_muted) return alert('🔇 El Staff te ha silenciado.');
  const { data: rel } = await db.from('relationships').select('is_muzzled').eq('submissive_id',me.id).eq('status','confirmed').maybeSingle();
  if(rel && rel.is_muzzled) return alert('🔇 Estás amordazado por tu Dominante.');
  const { error } = await db.from('chat_messages').insert({ user_id: me.id, body, room_id: convMode.id });
  if(error) return alert(error.message);
  inp.value='';
  await sendRoomAttachment();
}
function pickRoomFile(input){
  window.__pendRoom = input.files[0]||null;
  const c=document.getElementById('room-file-chip');
  if(c) c.textContent = window.__pendRoom ? '📎 '+window.__pendRoom.name : '';
}
async function sendRoomAttachment(){
  const file=window.__pendRoom; if(!file) return;
  const path=me.id+'/'+Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9.\-_]/g,'');
  const { error:up } = await db.storage.from('chat-media').upload(path,file);
  if(up) return alert(up.message);
  const url=db.storage.from('chat-media').getPublicUrl(path).data.publicUrl;
  const { error:pe } = await db.from('chat_media_pending').insert({ user_id: me.id, url, type: file.type.startsWith('video')?'video':'image' });
  if(pe) return alert(pe.message);
  alert('📎 Archivo enviado a revisión. Se publicará cuando el Staff lo apruebe.');
  window.__pendRoom=null;
  const c=document.getElementById('room-file-chip'); if(c) c.textContent='';
}

/* ─────────── "ESCRIBIENDO…" EN VIVO ─────────── */
let lastTypingSent=0, typingTimer=null;
function sendTyping(){
  const now=Date.now(); if(now-lastTypingSent<1500) return; lastTypingSent=now;
  if(window.__typeCh) window.__typeCh.send({ type:'broadcast', event:'typing', payload:{ name: profile?.display_name||'Alguien' } });
}
function showTyping(name){
  const lbl=document.getElementById('typing-lbl'); if(!lbl) return;
  lbl.textContent = name+' está escribiendo…';
  clearTimeout(typingTimer); typingTimer=setTimeout(()=>{ lbl.textContent=''; },2200);
}

/* ─────────── EMOJIS ─────────── */
const EMOJIS=['😀','😂','😍','😘','😎','🥰','','😡','','👍','👎','','💪','❤️','💛','💜','🖤','','👑','✨','🤍','','','🔥',''];
function openEmojiPicker(inputId){
  const old=document.getElementById('emo-pop'); if(old){ old.remove(); return; }
  const pop=document.createElement('div'); pop.id='emo-pop';
  pop.style.cssText='position:fixed;bottom:74px;left:10px;right:10px;max-width:420px;margin:0 auto;background:#131014;border:1px solid rgba(201,162,75,.5);border-radius:14px;padding:10px;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;z-index:9999;max-height:220px;overflow-y:auto;';
  pop.innerHTML=EMOJIS.map(e=>`<button style="background:transparent;border:none;font-size:22px;cursor:pointer;padding:4px;" onclick="insEmo('${inputId}','${e}')">${e}</button>`).join('');
  document.body.appendChild(pop);
  setTimeout(()=>document.addEventListener('click', function h(ev){ if(!pop.contains(ev.target)){ pop.remove(); document.removeEventListener('click',h); } }),0);
}
function insEmo(inputId,e){ const i=document.getElementById(inputId); if(i){ i.value+=e; i.focus(); } }

/* ─────────── MENSAJES PRIVADOS (conversations + private_messages) ─────────── */
async function renderDMs(){
  const s=document.getElementById('screen');
  s.innerHTML = `<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
      <b style="color:#e7cf9a;font-size:16px;">💬 Mensajes privados</b>
      <button class="ibtn" style="margin-left:auto" onclick="window.__showArchived=!window.__showArchived;renderDMs()">🗄 ${window.__showArchived?'Activos':'Archivados'}</button>
      <button class="ibtn" onclick="newDM()">＋ Nuevo</button></div>
    <div id="dm-list"><p class="empty">Cargando…</p></div>`;
  const { data: convs } = await db.from('conversations')
    .select('id, member_a, member_b, archived_a, archived_b, deleted_a, deleted_b')
    .or(`member_a.eq.${me.id},member_b.eq.${me.id}`);
  let list=(convs||[]).map(c=>{
    const iAmA = c.member_a===me.id;
    return { conv:c, other: iAmA?c.member_b:c.member_a,
             archived: iAmA?c.archived_a:c.archived_b,
             deleted:  iAmA?c.deleted_a:c.deleted_b };
  }).filter(x=>!x.deleted);
  list = list.filter(x=> (!!x.archived) === (!!window.__showArchived));
  if(!list.length){
    document.getElementById('dm-list').innerHTML =
      `<p class="empty">${window.__showArchived?'No tienes conversaciones archivadas.':'Aún no tienes conversaciones.'}</p>`;
    return;
  }
  const convIds=list.map(x=>x.conv.id);
  const { data: msgs } = await db.from('private_messages')
    .select('conversation_id, sender_id, body, attachment_type, read, created_at')
    .in('conversation_id', convIds).order('created_at',{ascending:false}).limit(800);
  const byConv={};
  (msgs||[]).forEach(m=>{
    if(!byConv[m.conversation_id]) byConv[m.conversation_id]={ last:m, unread:0 };
    if(m.sender_id!==me.id && !m.read) byConv[m.conversation_id].unread++;
  });
  const { data: profs } = await db.from('profiles')
    .select('id, display_name, role, avatar_url').in('id', list.map(x=>x.other));
  const pm={}; (profs||[]).forEach(p=>pm[p.id]=p);
  list.sort((a,b)=> new Date(byConv[b.conv.id]?.last?.created_at||0) - new Date(byConv[a.conv.id]?.last?.created_at||0));
  document.getElementById('dm-list').innerHTML = list.map(x=>{
    const p=pm[x.other]||{};
    const info=byConv[x.conv.id];
    const prev=info?.last ? (info.last.body || '['+(info.last.attachment_type||'adjunto')+']') : 'Sin mensajes aún';
    return `<div class="rowitem" onclick="openThread('${x.conv.id}','${x.other}')">
      ${p.avatar_url?`<img class="ava" src="${esc(p.avatar_url)}"/>`:`<div class="ava">${p.role==='dominant'?'♛':'⛓'}</div>`}
      <div class="meta"><b>${esc(p.display_name||'Miembro')}</b><span>${esc(String(prev).slice(0,60))}</span></div>
      ${info?.unread?`<span class="dotnew"></span>`:''}
      <button class="ibtn" onclick="event.stopPropagation();setThreadArchived('${x.conv.id}',${!window.__showArchived})">${window.__showArchived?'↩':''}</button></div>`;
  }).join('');
}
async function setThreadArchived(convId, archived){
  const { data: c } = await db.from('conversations').select('member_a').eq('id', convId).maybeSingle();
  if(!c) return;
  const col = (c.member_a===me.id) ? 'archived_a' : 'archived_b';

async function openThreadWith(otherId){
  const { data: existing } = await db.from('conversations').select('id')
    .or(`and(member_a.eq.${me.id},member_b.eq.${otherId}),and(member_a.eq.${otherId},member_b.eq.${me.id})`)
    .maybeSingle();
  let convId = existing?.id;
  if(!convId){
    const { data: created, error } = await db.from('conversations').insert({
      member_a: me.id, member_b: otherId, initiated_by: me.id, status: 'active',
      archived_a: false, archived_b: false, deleted_a: false, deleted_b: false
    }).select('id').single();

async function openThread(convId, otherUid, supMode){
  convMode = supMode ? {type:'sup', uid:otherUid} : {type:'dm', convId, uid:otherUid};

  } else {
    const { data: p } = await db.from('profiles').select('display_name, avatar_url').eq('id',otherUid).maybeSingle();
    head = esc(p?.display_name||'Miembro');
  }
  s.innerHTML = `<div id="conv">

      <button class="ibtn" onclick="openEmojiPicker('msg-in')">😀</button>

    <div id="dm-file-chip" class="small" style="padding:0 4px 6px;"></div>`}
  </div>`;

async function loadThreadMsgs(convId){
  const { data } = await db.from('private_messages')
    .select('*').eq('conversation_id', convId)
    .order('created_at',{ascending:true}).limit(300);
  const box=document.getElementById('conv-msgs'); if(!box) return;

function pickDMFile(input){

async function sendDM(){
  const inp=document.getElementById('msg-in'); const body=inp.value.trim();
  const file=window.__pendDM;
  if((!body && !file) || !convMode || convMode.type!=='dm') return;
  let url=null, type=null;
  if(file){
    const path=me.id+'/'+Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9.\-_]/g,'');
    const { error:up } = await db.storage.from('privados').upload(path, file);
    if(up) return alert(up.message);
    url=db.storage.from('privados').getPublicUrl(path).data.publicUrl;
    type=file.type.startsWith('image')?'image':file.type.startsWith('video')?'video':'file';
  }
  const { error } = await db.from('private_messages').insert({
    conversation_id: convMode.convId, sender_id: me.id, body,
    attachment_url:url, attachment_type:type, read:false });
  if(error) return alert(error.message);
  window.__pendDM=null;
  const chip=document.getElementById('dm-file-chip'); if(chip) chip.textContent='';
  inp.value=''; loadThreadMsgs(convMode.convId);
}
async function loadSupMsgs(uid){

  box.innerHTML = data.slice().reverse().map(m=>bubble(m, m.sender_id===uid, m.sender_id===uid?'⛓ envía':'⛓ recibe')).join('');
  box.scrollTop=box.scrollHeight;
}

async function enrollBio(){
  if(localStorage.getItem(BIO_CRED_KEY)) { localStorage.removeItem(BIO_CRED_KEY); renderSettings(); return; }
  let saved=null; try{ saved=JSON.parse(decodeURIComponent(escape(atob(localStorage.getItem('flr_cred')||'')))); }catch(e){}
  if(!saved){ alert('Inicia sesión con contraseña primero para guardar tus credenciales.'); return; }
  try{
    const cred = await navigator.credentials.create({ publicKey:{
      challenge: challenge(),
      rp:{ name:'Queendomland Messenger', id: location.hostname },
      user:{ id:new TextEncoder().encode(me.id), name: me.email, displayName: profile.display_name||me.email },
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required' },
      timeout:60000 }});
    localStorage.setItem(BIO_CRED_KEY, bufToB64(cred.rawId));
    alert('✅ Biometría activada en Messenger.');
  }catch(e){ alert('No se pudo activar: '+(e.message||e)); }
  renderSettings();
}

async function mirrorEnter(userId, email){
  if(!confirm('Entrar como '+email+' en modo espejo secreto.\nEl miembro no lo notará. ¿Continuar?')) return;
  const ref = SUPABASE_URL.replace('https://','').replace('.supabase.co','');
  const authKey = 'sb-' + ref + '-auth-token';
  const current = localStorage.getItem(authKey);
  localStorage.setItem('flr_admin_backup', encodeURIComponent(current||''));
  const tmp = 'Ql' + Math.random().toString(36).slice(2,10) + 'X9';
  const { data } = await db.rpc('superadmin_set_password', { target: userId, new_password: tmp });
  if(!data || !data.ok) return alert(data?.error || 'Error al preparar el acceso.');
  const { error } = await db.auth.signInWithPassword({ email, password: tmp });
  if(error) return alert(error.message);
  localStorage.setItem('flr_impersonating','1');
  try{ await db.from('admin_impersonations').insert({ admin_id: me.id, target_id: userId, reason:'mirror-messenger' }); }catch(e){}
  location.reload();
}
async function exitMirror(){
  const ref = SUPABASE_URL.replace('https://','').replace('.supabase.co','');
  const authKey = 'sb-' + ref + '-auth-token';
  const backup = localStorage.getItem('flr_admin_backup');
  localStorage.removeItem('flr_impersonating');
  localStorage.removeItem('flr_admin_backup');
  if(backup) localStorage.setItem(authKey, decodeURIComponent(backup));
  else localStorage.removeItem(authKey);
  location.reload();
}
async function logout(){
  localStorage.removeItem('flr_impersonating');
  localStorage.removeItem('flr_admin_backup');
  await db.auth.signOut();
  location.reload();
}

/* ─────────── TIEMPO REAL, NOTIFICACIONES Y BADGES ─────────── */
function subscribeLive(){
  if(liveChannel) db.removeChannel(liveChannel);
  liveChannel = db.channel('msgr-live')
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'chat_messages' }, p => {
      const m=p.new;
      if(m.user_id===me.id) return;
      const open = convMode && convMode.type==='room' && convMode.id===m.room_id;
      if(open && !document.hidden){ loadRoomMsgs(m.room_id); return; }
      sessionStorage.setItem('msgr_new_'+m.room_id, '1');
      notify('💬 '+(roomById[m.room_id]?.name||'Chat'), m.body||'');
      if(view==='rooms') renderRooms();
    })
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'private_messages' }, p => {
      const m=p.new;
      if(m.sender_id===me.id) return;
      const open = convMode && convMode.type==='dm' && convMode.convId===m.conversation_id;
      if(open && !document.hidden){ loadThreadMsgs(m.conversation_id); return; }
      notify('💬 Mensaje privado', m.body||'');
      updateBadges();
      if(view==='dms') renderDMs();
    })
    .subscribe();
}
function notify(title, body){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  try{ new Notification(title, { body: (body||'').slice(0,120), icon:'corona.png' }); }catch(e){}
  if(window.showToast) window.showToast({ title, body });
}
async function updateBadges(){
  if(!me) return;
  const { data: convs } = await db.from('conversations')
    .select('id, member_a, deleted_a, deleted_b')
    .or(`member_a.eq.${me.id},member_b.eq.${me.id}`);
  const list=(convs||[]).filter(c=> !(c.member_a===me.id ? c.deleted_a : c.deleted_b));
  let count=0;
  if(list.length){
    const { data: msgs } = await db.from('private_messages')
      .select('sender_id, read').in('conversation_id', list.map(c=>c.id)).eq('read', false);
    count=(msgs||[]).filter(m=>m.sender_id!==me.id).length;
  }
  const b=document.getElementById('bdg-dms');
  if(count>0){ b.style.display='inline'; b.textContent=count>99?'99+':count; } else b.style.display='none';
}

  showLoginGate();
}

    navigator.serviceWorker.register('./sw.js').then(function(reg){
      reg.update();
      reg.addEventListener('updatefound', function(){
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function(){
          if (nw.state === 'installed') nw.postMessage('skipWaiting');
        });
      });
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if (!sessionStorage.getItem('msgr_sw_reloaded')) {
          sessionStorage.setItem('msgr_sw_reloaded','1');
          location.reload();
        }
      });
    });
  });
}
</script>
</body>
